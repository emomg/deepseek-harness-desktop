name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release
        working-directory: src-tauri
        run: cargo build --release

      - name: Stage built-in plugins (slim: sources only)
        shell: pwsh
        run: |
          # 内置插件源码目录（正式版：dsh-files + dsh-plugin-image-input）
          New-Item -ItemType Directory -Force installer\build\plugins
          Copy-Item dsh-files installer\build\plugins\dsh-files -Recurse -Force
          Copy-Item dsh-plugin-image-input installer\build\plugins\dsh-plugin-image-input -Recurse -Force
          # 移除任何误入的 node_modules（精简版由桌面端首次启动提示 npm install）
          Get-ChildItem installer\build\plugins -Directory -Filter node_modules -Recurse | Remove-Item -Recurse -Force

      - name: Package NSIS installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer\build
          Copy-Item src-tauri\target\release\dsh-desktop.exe installer\build\
          # WebView2Loader.dll（GNU/动态链接构建必需）：来自 NuGet 官方包
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2903.40" -OutFile "$env:TEMP\wv2.zip"
          Expand-Archive "$env:TEMP\wv2.zip" -DestinationPath "$env:TEMP\wv2" -Force
          Copy-Item "$env:TEMP\wv2\runtimes\win-x64\native\WebView2Loader.dll" installer\build\ -Force
          # WebView2 Runtime 引导器（缺失时自动安装）
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile installer\build\MicrosoftEdgewebview2Setup.exe
          # 便携版 NSIS
          $nsisZip = "$env:TEMP\nsis.zip"
          Invoke-WebRequest -Uri "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3/nsis-3.zip" -OutFile $nsisZip
          Expand-Archive $nsisZip -DestinationPath "$env:TEMP\nsis" -Force
          $makensis = Get-ChildItem "$env:TEMP\nsis" -Recurse -Filter "makensis.exe" | Select-Object -First 1
          if (-not $makensis) { throw "makensis not found after NSIS extraction" }
          & $makensis.FullName installer\installer.nsi

      - name: Stage full runtime (self-contained installer)
        shell: pwsh
        run: |
          # 仅本地/手动 full 构建：把运行时与含 node_modules 的插件一并打入。
          # CI 默认只出精简版；full 版由发布流程本地生成（见 tools/rel-full*.mjs）。
          if (Test-Path "$env:DSH_FULL_RUNTIME_DIR") {
            Copy-Item "$env:DSH_FULL_RUNTIME_DIR" installer\build\runtime -Recurse -Force
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer\*.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/*.exe
