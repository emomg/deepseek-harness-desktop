# dsh-files: 回形针上传 PDF/Word/Excel/TXT，让 Harness 直接读文件
- insert:
    - id: dsh-files
      name: 'dsh-files'
      config:
        uploadDir: 'D:/dsh/.dsh-uploads'
        maxUploadBytes: 25165824
        allowedExtensions: []
        uploadTtlMs: 604800000
        sweepIntervalMs: 3600000
        maxFileBytes: 25165824
        readLimit: 800
        sheetRowLimit: 200
        maxSheets: 5
        maxOutputChars: 50000
