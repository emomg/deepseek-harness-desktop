<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DeepSeek Harness</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(120% 90% at 85% -10%, rgba(62,120,255,.16), transparent 60%),
                    radial-gradient(100% 80% at -10% 110%, rgba(126,66,255,.12), transparent 55%),
                    #070b14;
        color: #e8ecf4;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        overflow: hidden;
      }
      .inner { display: flex; flex-direction: column; align-items: center; gap: 18px; animation: in .5s ease both; }
      @keyframes in { from { opacity: 0; transform: translateY(8px) scale(.98); } }
      .logo { width: 132px; height: 132px; object-fit: contain; filter: drop-shadow(0 0 24px rgba(80,140,255,.35)); animation: float 3.6s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      .name { font-size: 19px; font-weight: 600; letter-spacing: .02em; }
      .spinner { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,.16); border-top-color: #5b8cff; animation: spin .9s linear infinite; }
      @keyframes spin { to { transform: rotate(1turn); } }
      .hint { color: rgba(232,236,244,.55); font-size: 12px; letter-spacing: .08em; }
      .elapsed { color: rgba(232,236,244,.35); font-size: 11px; font-variant-numeric: tabular-nums; }
      @media (prefers-reduced-motion: reduce) { .logo, .inner, .spinner { animation: none; } }
    </style>
