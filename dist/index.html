<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DSH Desktop</title>
    <style>
      body { margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; background: #101828; color: #e5e7eb; font-family: system-ui, sans-serif; }
      .box { text-align: center; }
      .dot { width: 40px; height: 40px; border-radius: 50%; background: conic-gradient(from 0deg, #4f7cff, #8b5cf6); margin: 0 auto 16px; animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.4; } }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="dot"></div>
      <div>正在启动 DSH 服务…</div>
    </div>
  </body>
</html>
